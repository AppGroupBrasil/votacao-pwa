services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-votacao_db}
      POSTGRES_USER: ${POSTGRES_USER:-votacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votacao} -d ${POSTGRES_DB:-votacao_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-votacao}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-votacao_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz/', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${APP_DOMAIN:-localhost}/api}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${APP_DOMAIN:-localhost}/api}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db_backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-votacao}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-votacao_db}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup service ativo (diário às 03:00 UTC)"
        while true; do
          H=$$(date -u +%H); M=$$(date -u +%M); S=$$(date -u +%S)
          SEC_TODAY=$$((10#$$H*3600 + 10#$$M*60 + 10#$$S))
          TARGET=10800
          if [ $$SEC_TODAY -lt $$TARGET ]; then
            SLEEP=$$((TARGET - SEC_TODAY))
          else
            SLEEP=$$((86400 - SEC_TODAY + TARGET))
          fi
          echo "[backup] aguardando $${SLEEP}s ate proximo 03:00 UTC"
          sleep $$SLEEP

          STAMP=$$(date -u +%Y%m%d_%H%M%S)
          FILE="/backups/votacao_$${STAMP}.sql.gz"
          echo "[backup] iniciando $${FILE}"

          if pg_dump --format=plain --no-owner --no-privileges | gzip > "$${FILE}"; then
            # Valida integridade do gzip e checa que SQL não está vazio
            if gunzip -t "$${FILE}" 2>/dev/null && [ "$$(gunzip -c "$${FILE}" | head -c 100 | wc -c)" -gt 50 ]; then
              SIZE=$$(stat -c%s "$${FILE}" 2>/dev/null || echo "?")
              echo "[backup] OK $${FILE} ($${SIZE} bytes)"
            else
              echo "[backup] FALHOU validacao $${FILE}"
              rm -f "$${FILE}"
            fi
          else
            echo "[backup] FALHOU pg_dump"
            rm -f "$${FILE}"
          fi

          find /backups -name "votacao_*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 60
        done

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:

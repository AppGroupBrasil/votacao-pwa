# docker-compose.coolify.yml
# Stack de produção para Hetzner + Coolify + Traefik v3
# Domínio: appvotacao.com.br | Servidor: 46.225.191.114

services:
  db:
    image: postgres:16-alpine
    container_name: votacao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-votacao_db}
      POSTGRES_USER: ${POSTGRES_USER:-votacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - votacao_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-votacao} -d ${POSTGRES_DB:-votacao_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: votacao-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    container_name: votacao-backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-votacao}:${POSTGRES_PASSWORD}@votacao-db:5432/${POSTGRES_DB:-votacao_db}
      CELERY_BROKER_URL: redis://votacao-redis:6379/0
      CELERY_RESULT_BACKEND: redis://votacao-redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - coolify
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://appvotacao.com.br/api
    container_name: votacao-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://appvotacao.com.br/api
    depends_on:
      - backend
    networks:
      - internal
      - coolify
    labels:
      - "traefik.enable=false"

  db_backup:
    image: postgres:16-alpine
    container_name: votacao-db-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: votacao-db
      PGUSER: ${POSTGRES_USER:-votacao}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-votacao_db}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - /mnt/docker-data/backups/votacao:/backups
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup service ativo (diário às 03:00 UTC)"
        while true; do
          NOW_TS=$$(date -u +%s)
          NEXT_TS=$$(date -u -d "tomorrow 03:00" +%s 2>/dev/null || date -u -d "$$(date -u +%Y-%m-%d) 03:00 + 1 day" +%s)
          SLEEP=$$((NEXT_TS - NOW_TS))
          if [ "$$SLEEP" -gt 0 ] && [ "$$SLEEP" -lt 86400 ]; then
            echo "[backup] aguardando $${SLEEP}s ate proximo 03:00 UTC"
            sleep $$SLEEP
          fi
          STAMP=$$(date -u +%Y%m%d_%H%M%S)
          FILE="/backups/votacao_$${STAMP}.sql.gz"
          echo "[backup] iniciando $${FILE}"
          if pg_dump --format=plain --no-owner --no-privileges | gzip > "$${FILE}"; then
            if gunzip -t "$${FILE}" 2>/dev/null && [ "$$(gunzip -c "$${FILE}" | head -c 100 | wc -c)" -gt 50 ]; then
              SIZE=$$(stat -c%s "$${FILE}" 2>/dev/null || echo "?")
              echo "[backup] OK $${FILE} ($${SIZE} bytes)"
            else
              echo "[backup] FALHOU validacao $${FILE}"
              rm -f "$${FILE}"
            fi
          else
            echo "[backup] FALHOU pg_dump"
            rm -f "$${FILE}"
          fi
          find /backups -name "votacao_*.sql.gz" -mtime +$${BACKUP_RETENTION_DAYS} -delete
          sleep 60
        done

volumes:
  votacao_postgres:

networks:
  internal:
    driver: bridge
  coolify:
    external: true
